<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1C1830"/>
      <stop offset="60%" stop-color="#0D0B16"/>
      <stop offset="100%" stop-color="#07060D"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#8A2BEF"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#8A2BEF"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="170" r="110" fill="#FFB020" opacity="0.18" filter="url(#glowFilter)"/>
  <circle cx="200" cy="170" r="85" stroke="url(#neonGlow)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35"/>

  <g transform="translate(0, 15)">
    <ellipse cx="200" cy="145" rx="52" ry="62" fill="url(#avatarGrad)" opacity="0.88"/>
    <path d="M110 320 C110 245, 145 220, 200 220 C255 220, 290 245, 290 320 L290 350 L110 350 Z" fill="url(#avatarGrad)" opacity="0.85"/>
    <path d="M175 224 L200 262 L225 224" stroke="#07060D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 262 L200 330" stroke="#07060D" stroke-width="3" stroke-linecap="round"/>
    <path d="M148 248 L175 320" stroke="url(#neonGlow)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M252 248 L225 320" stroke="url(#neonGlow)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <rect x="1.5" y="1.5" width="397" height="397" rx="30" stroke="url(#neonGlow)" stroke-width="1.5" opacity="0.4"/>
